   name: Flutter

   on:
     push:
     pull_request:

   jobs:
     test:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: subosito/flutter-action@v2
           with:
             flutter-version: '3.27.4'
             channel: stable
         - run: flutter pub get
         - run: flutter analyze --no-fatal-infos
         - run: flutter test
