plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Sin configuración válida se compila la pantalla de conexión pendiente.
// No imprimir el JSON del cliente ni generar credenciales de demostración.
def googleConfig = file("google-services.json")
def googleConfigReady = false
if (googleConfig.exists()) {
    try {
        def config = new groovy.json.JsonSlurper().parse(googleConfig)
        googleConfigReady = config.project_info?.project_id && config.project_info?.project_number &&
            config.client?.any { client ->
                client.client_info?.android_client_info?.package_name == "com.lapticon.lapticon" &&
                client.client_info?.mobilesdk_app_id && client.api_key?.any { it.current_key }
            }
    } catch (Exception ignored) {
        googleConfigReady = false
    }
    if (!googleConfigReady) logger.warn("Configuracion Firebase Android invalida o package incorrecto: se mantiene la conexion pendiente.")
}
if (googleConfigReady) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace = "com.lapticon.lapticon"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.lapticon.lapticon"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
